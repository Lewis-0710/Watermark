name: watermark_remover
description: A Flutter app to remove watermarks from photos and videos.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  file_picker: ^6.1.1
  image_picker: ^1.0.7
  video_player: ^2.8.6
  provider: ^6.1.1
  image: ^4.1.7
  path_provider: ^2.1.2
  permission_handler: ^11.3.0
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  uuid: ^4.3.3
  dio: ^5.4.3+1
  gal: ^2.3.0
  screenshot: ^3.0.0
  window_manager: ^0.3.8
  universal_platform: ^1.0.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
